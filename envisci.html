<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>EnviSci</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f8fafc;

  display: flex;
  flex-direction: column;
  min-height: 100vh;
}


.navbar {
  display: flex;
  justify-content: center;
  gap: 30px;
  background: #93c5fd;
  box-sizing: border-box;
  padding: 15px;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar a {
  color: white;
  text-decoration: none;
  transition: 0.3s;
}

.navbar a:hover {
  transform: scale(1.2);
  text-decoration: underline;
}


.container {
  flex: 1;
  text-align: center;
  padding: 20px;
}


h1 {
  margin-top: 40px;
}


.footer {
  color: #64748b;
  text-align: center;
  padding: 20px;
  border-top: 1px solid #ddd;
}


.dropdown {
  position: relative;
}


.dropdown-content {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;

  background: white;
  min-width: 180px;
  border-radius: 10px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.1);

  overflow: hidden;
}


.dropdown-content a {
  display: block;
  padding: 10px;
  color: #334155;
  text-decoration: none;
}


.dropdown-content a:hover {
  background: #f1f5f9;
  transform: scale(1.05);
}


.dropdown:hover .dropdown-content {
  display: block;
}

.toc {
  position: fixed;
  left: 100px;
  top: 120px;

  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toc a {
  text-decoration: none;
  color: #3b82f6;
  font-size: 16px;
}

.toc a:hover {
  text-decoration: underline;
}

html {
  scroll-behavior: smooth;
}

  .gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin-top: 30px;
}

.gallery img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

</style>
</head>
